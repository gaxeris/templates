spring:
  application:
    name: template
  datasource:
    url: jdbc:h2:mem:default;DB_CLOSE_DELAY=-1;NON_KEYWORDS=user,group,namespace,role;
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console